name: JOTTA Clip Watcher

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

concurrency:
  group: jotta-clip-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-clips:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check JOTTA clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_CHANNEL: jotta
          DISCORD_CLIP_WEBHOOK_URL: ${{ secrets.DISCORD_CLIP_WEBHOOK_URL }}

        run: |
          python src/main.py

      - name: Save clip database
        if: always()
        run: |

          if git diff --quiet -- data/state.json; then
            echo "No database changes."
            exit 0
          fi

          git config user.name "JOTTA Clip Watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state.json

          git commit -m "Update JOTTA clip database"

          git push
